services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-ecom-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mini_ecom} -d ${POSTGRES_DB:-mini_ecom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mini_ecom_pgdata:/var/lib/postgresql/data

  app:
    image: ${APP_IMAGE:-mini-ecom-app:latest}
    container_name: mini-ecom-app
    build:
      context: .
    profiles:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    restart: unless-stopped

  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    container_name: mini-ecom-jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mini_ecom_pgdata:
  jenkins_home:
